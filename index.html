<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Watch Pro</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --accent: #58a6ff;
    --yellow: #d29922;
    --crash: #da3633;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    line-height: 1.4;
    max-width: 1400px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { font-size: 1.5rem; font-weight: 600; }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .market-status {
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.75rem;
  }
  .open { background: #238636; color: white; }
  .closed { background: #6e7681; color: white; }
  .refresh, .sort-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .refresh:hover, .sort-btn:hover { border-color: var(--accent); }
  .sort-btn.active { border-color: var(--crash); background: #2d1a1a; }
  .movers, .portfolio-summary, .news {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 16px;
    font-size: 0.8rem;
  }
  .movers { overflow-x: auto; white-space: nowrap; }
  .mover { margin-right: 16px; }
  .section {
    margin-bottom: 20px;
  }
  .section h2 {
    font-size: 1.1rem;
    margin-bottom: 10px;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    transition: border-color 0.2s, transform 0.1s;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.crash { border-color: var(--crash); box-shadow: 0 0 8px rgba(218,54,51,0.3); }
  .card.bigup { border-color: var(--green); }
  .symbol { font-weight: 600; font-size: 0.95rem; }
  .name { color: var(--muted); font-size: 0.7rem; margin-bottom: 6px; }
  .price { font-size: 1.25rem; font-weight: 600; }
  .change { font-size: 0.85rem; font-weight: 500; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .flat { color: var(--muted); }
  .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 0.65rem;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 700;
  }
  .badge.crash { background: var(--crash); color: white; }
  .badge.opp { background: var(--green); color: white; }
  .badge.trend { background: var(--accent); color: white; top: 28px; }
  .spark { width: 100%; height: 32px; margin-top: 6px; }
  .add-box, .portfolio-input {
    margin: 12px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .add-box input, .portfolio-input input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    flex: 1;
    min-width: 100px;
  }
  .add-box button, .portfolio-input button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  .remove {
    position: absolute;
    top: 4px;
    left: 4px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    opacity: 0.6;
  }
  .remove:hover { color: var(--red); opacity: 1; }
  .shares-input {
    width: 60px;
    margin-top: 4px;
    font-size: 0.75rem;
    padding: 2px 4px;
  }
  #chart-container {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    height: 420px;
  }
  .news-item {
    margin: 4px 0;
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }
  .news-item a { color: var(--accent); text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }
  .news-meta { color: var(--muted); font-size: 0.7rem; }
  footer {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.7rem;
  }
  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr 1fr; }
    #chart-container { height: 300px; }
  }
</style>
</head>
<body>
<header>
  <h1>Market Watch Pro</h1>
  <div class="status-bar">
    <span class="market-status" id="marketStatus">...</span>
    <span id="status">Loading...</span>
    <button class="sort-btn" id="sortCrash" onclick="toggleSortCrash()">Sort by Biggest Crash</button>
    <button class="refresh" onclick="loadData()">Refresh</button>
  </div>
</header>

<div class="portfolio-summary" id="portfolioSummary">Portfolio: loading...</div>

<div class="movers" id="movers">Top movers loading...</div>

<div class="add-box">
  <input type="text" id="newTicker" placeholder="Add ticker (e.g. AAPL, BTC-USD)" onkeydown="if(event.key==='Enter')addTicker()">
  <button onclick="addTicker()">Add</button>
</div>

<div id="sections"></div>

<div class="news" id="news">
  <h2 style="margin-bottom:8px;color:var(--accent);">Market News Headlines</h2>
  <div id="newsList">Loading headlines...</div>
</div>

<div id="chart-container">
  <div class="tradingview-widget-container" style="height:100%;width:100%">
    <div id="tradingview_widget" style="height:100%;width:100%"></div>
  </div>
</div>

<footer>Data from Yahoo Finance, CoinGecko & Quotelinks · Auto-refreshes every 60s · Click any card for chart · Simple trend based on 5d · Not financial advice</footer>

<script>
const DEFAULTS = {
  indices: [
    { symbol: '^GSPC', name: 'S&P 500' },
    { symbol: '^DJI', name: 'Dow Jones' },
    { symbol: '^IXIC', name: 'Nasdaq' },
    { symbol: '^VIX', name: 'VIX' },
    { symbol: 'GC=F', name: 'Gold' },
    { symbol: '^TNX', name: '10Y Yield' }
  ],
  ai: [
    { symbol: 'NVDA', name: 'Nvidia' },
    { symbol: 'AMD', name: 'AMD' },
    { symbol: 'MU', name: 'Micron' },
    { symbol: 'AVGO', name: 'Broadcom' },
    { symbol: 'TSLA', name: 'Tesla' },
    { symbol: 'SPCX', name: 'SpaceX' },
    { symbol: 'ANT', name: 'Anthropic' }
  ],
  defensive: [
    { symbol: 'GIS', name: 'General Mills' },
    { symbol: 'WMT', name: 'Walmart' },
    { symbol: 'COST', name: 'Costco' }
  ],
  crypto: [
    { id: 'bitcoin', symbol: 'BTC', name: 'Bitcoin' },
    { id: 'ethereum', symbol: 'ETH', name: 'Ethereum' },
    { id: 'solana', symbol: 'SOL', name: 'Solana' },
    { id: 'ripple', symbol: 'XRP', name: 'XRP' },
    { id: 'dogecoin', symbol: 'DOGE', name: 'Dogecoin' }
  ]
};

let custom = JSON.parse(localStorage.getItem('mw_custom') || '[]');
let holdings = JSON.parse(localStorage.getItem('mw_holdings') || '{}');
let sortByCrash = localStorage.getItem('mw_sortCrash') === 'true';

function saveCustom() { localStorage.setItem('mw_custom', JSON.stringify(custom)); }
function saveHoldings() { localStorage.setItem('mw_holdings', JSON.stringify(holdings)); }
function saveSort() { localStorage.setItem('mw_sortCrash', sortByCrash); }

function getAllStocks() {
  return [...DEFAULTS.indices, ...DEFAULTS.ai, ...DEFAULTS.defensive, ...custom.filter(c => !c.crypto)];
}

async function fetchOneStock(symbol) {
  const url = `https://proxy.cors.dev/?https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=5d&interval=1d`;
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const result = data?.chart?.result?.[0];
    if (!result) return null;
    const meta = result.meta;
    const closes = result.indicators?.quote?.[0]?.close || [];
    const spark = closes.filter(c => c != null).slice(-5);
    const price = meta.regularMarketPrice;
    const prev = meta.chartPreviousClose || meta.previousClose;
    return {
      symbol,
      price,
      prev,
      change: price - (prev || price),
      pct: price && prev ? ((price - prev) / prev) * 100 : 0,
      spark
    };
  } catch (e) {
    console.error(symbol, e);
    return null;
  }
}

async function fetchCrypto() {
  const ids = [...DEFAULTS.crypto.map(c => c.id), ...custom.filter(c => c.crypto).map(c => c.id)].filter(Boolean).join(',');
  if (!ids) return {};
  const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;
  try {
    const res = await fetch(url);
    return await res.json();
  } catch (e) {
    return {};
  }
}

async function fetchNews() {
  try {
    const res = await fetch('https://api.quotelinks.com/v1/news/latest');
    if (!res.ok) throw new Error('news fail');
    const data = await res.json();
    return (data.articles || data || []).slice(0, 8);
  } catch (e) {
    // Fallback simple links
    return [
      { title: 'Yahoo Finance Markets', url: 'https://finance.yahoo.com/news/' },
      { title: 'CNBC Markets', url: 'https://www.cnbc.com/markets/' },
      { title: 'CoinDesk Crypto', url: 'https://www.coindesk.com/' }
    ];
  }
}

function formatPrice(price, symbol) {
  if (price == null) return '—';
  if (symbol === '^TNX') return price.toFixed(2) + '%';
  if (price >= 1000) return price.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (price >= 1) return price.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return price.toFixed(4);
}

function formatChange(change, pct) {
  if (change == null && pct == null) return { text: '—', cls: 'flat' };
  const sign = (pct ?? change) >= 0 ? '+' : '';
  const cls = (pct ?? change) > 0 ? 'up' : (pct ?? change) < 0 ? 'down' : 'flat';
  let text = '';
  if (change != null) text += sign + Math.abs(change).toFixed(2);
  if (pct != null) text += (text ? ' ' : '') + '(' + sign + pct.toFixed(2) + '%)';
  return { text, cls, pct: pct ?? 0 };
}

function sparkSVG(data, color) {
  if (!data || data.length < 2) return '';
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const w = 100, h = 30;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    return `${x},${y}`;
  }).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="1.5" points="${points}"/></svg>`;
}

function getTrend(spark) {
  if (!spark || spark.length < 2) return '';
  const first = spark[0];
  const last = spark[spark.length - 1];
  const chg = ((last - first) / first) * 100;
  if (chg > 3) return 'UP TREND';
  if (chg < -3) return 'DOWN TREND';
  return 'FLAT';
}

function renderCard(item, q, isCrypto = false, isCustom = false) {
  const symbol = isCrypto ? item.symbol : item.symbol.replace('^','').replace('=F','');
  const price = q ? formatPrice(isCrypto ? q.usd : q.price, item.symbol) : '—';
  const changeInfo = q ? formatChange(isCrypto ? null : q.change, isCrypto ? q.usd_24h_change : q.pct) : { text: '—', cls: 'flat', pct: 0 };
  const pct = changeInfo.pct || 0;
  let badge = '';
  let extraClass = '';
  if (pct <= -8) { badge = '<span class="badge crash">CRASH</span>'; extraClass = 'crash'; }
  else if (pct <= -5) { badge = '<span class="badge crash">BIG DROP</span>'; extraClass = 'crash'; }
  else if (pct >= 5) { badge = '<span class="badge opp">BIG MOVE</span>'; extraClass = 'bigup'; }
  const trend = (!isCrypto && q?.spark) ? getTrend(q.spark) : '';
  const trendBadge = trend ? `<span class="badge trend">${trend}</span>` : '';
  const spark = (!isCrypto && q?.spark) ? sparkSVG(q.spark, pct >= 0 ? '#3fb950' : '#f85149') : '';
  const removeBtn = isCustom ? `<button class="remove" onclick="event.stopPropagation();removeTicker('${item.symbol || item.id}')">×</button>` : '';
  const chartSym = isCrypto ? item.symbol + 'USD' : item.symbol;
  const holdKey = item.symbol || item.id;
  const shares = holdings[holdKey]?.shares || '';
  const sharesInput = `<input type="number" class="shares-input" placeholder="shares" value="${shares}" onchange="updateShares('${holdKey}', this.value)" onclick="event.stopPropagation()">`;
  return `
    <div class="card ${extraClass}" onclick="showChart('${chartSym}')">
      ${removeBtn}
      ${badge}
      ${trendBadge}
      <div class="symbol">${symbol}</div>
      <div class="name">${item.name}</div>
      <div class="price">${price}</div>
      <div class="change ${changeInfo.cls}">${changeInfo.text}</div>
      ${spark}
      ${sharesInput}
    </div>
  `;
}

function updateShares(key, val) {
  const num = parseFloat(val) || 0;
  if (num > 0) holdings[key] = { shares: num };
  else delete holdings[key];
  saveHoldings();
  updatePortfolioSummary();
}

function updatePortfolioSummary() {
  // Simple summary based on current data - will refresh on load
  const el = document.getElementById('portfolioSummary');
  const keys = Object.keys(holdings);
  if (!keys.length) {
    el.innerHTML = 'Portfolio: No holdings entered. Add shares on any card.';
    return;
  }
  el.innerHTML = `Portfolio: ${keys.length} position(s) tracked. Enter shares on cards for daily P&L estimate.`;
}

function updateMarketStatus() {
  const now = new Date();
  const et = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = et.getDay();
  const hours = et.getHours();
  const mins = et.getMinutes();
  const time = hours * 60 + mins;
  const isOpen = day >= 1 && day <= 5 && time >= 570 && time < 960;
  const el = document.getElementById('marketStatus');
  el.textContent = isOpen ? 'Market Open' : 'Market Closed';
  el.className = 'market-status ' + (isOpen ? 'open' : 'closed');
}

function showChart(symbol) {
  const container = document.getElementById('tradingview_widget');
  container.innerHTML = '';
  new TradingView.widget({
    "autosize": true,
    "symbol": symbol,
    "interval": "D",
    "timezone": "America/New_York",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#161b22",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "container_id": "tradingview_widget"
  });
  document.getElementById('chart-container').scrollIntoView({ behavior: 'smooth' });
}

function addTicker() {
  const input = document.getElementById('newTicker');
  let val = input.value.trim().toUpperCase();
  if (!val) return;
  if (custom.some(c => (c.symbol || c.id) === val || c.symbol === val)) return;
  const cryptoMap = { 'BTC': 'bitcoin', 'BTC-USD': 'bitcoin', 'ETH': 'ethereum', 'ETH-USD': 'ethereum', 'SOL': 'solana', 'SOL-USD': 'solana', 'XRP': 'ripple', 'XRP-USD': 'ripple', 'DOGE': 'dogecoin', 'DOGE-USD': 'dogecoin' };
  if (cryptoMap[val] || val.includes('-USD')) {
    const id = cryptoMap[val] || val.replace('-USD','').toLowerCase();
    const sym = val.replace('-USD','');
    custom.push({ id, symbol: sym, name: val, crypto: true });
  } else {
    custom.push({ symbol: val, name: val });
  }
  saveCustom();
  input.value = '';
  loadData();
}

function removeTicker(sym) {
  custom = custom.filter(c => (c.symbol || c.id) !== sym && c.symbol !== sym);
  saveCustom();
  loadData();
}

function toggleSortCrash() {
  sortByCrash = !sortByCrash;
  saveSort();
  document.getElementById('sortCrash').classList.toggle('active', sortByCrash);
  loadData();
}

async function loadData() {
  updateMarketStatus();
  document.getElementById('sortCrash').classList.toggle('active', sortByCrash);
  const status = document.getElementById('status');
  status.textContent = 'Updating...';
  const sectionsEl = document.getElementById('sections');
  const moversEl = document.getElementById('movers');
  const newsList = document.getElementById('newsList');

  const stocks = getAllStocks();
  const stockPromises = stocks.map(s => fetchOneStock(s.symbol).then(q => ({ ...s, q })));
  const [stockResults, cryptoData, newsItems] = await Promise.all([
    Promise.all(stockPromises),
    fetchCrypto(),
    fetchNews()
  ]);

  const allItems = [];
  let html = '';

  function addSection(title, items, isCrypto = false) {
    if (!items.length) return;
    let sortedItems = [...items];
    if (sortByCrash && !isCrypto) {
      sortedItems.sort((a, b) => (a.q?.pct || 0) - (b.q?.pct || 0));
    }
    html += `<div class="section"><h2>${title}</h2><div class="grid">`;
    for (const item of sortedItems) {
      const q = isCrypto ? cryptoData[item.id] : item.q;
      const isCustom = custom.some(c => (c.symbol || c.id) === (item.symbol || item.id));
      html += renderCard(item, q, isCrypto, isCustom);
      if (q) {
        const pct = isCrypto ? (q.usd_24h_change || 0) : (item.q?.pct || 0);
        allItems.push({ symbol: item.symbol || item.name, pct, name: item.name });
      }
    }
    html += '</div></div>';
  }

  addSection('Indices & Macro', DEFAULTS.indices.map(s => stockResults.find(r => r.symbol === s.symbol) || s));
  addSection('AI & Tech', DEFAULTS.ai.map(s => stockResults.find(r => r.symbol === s.symbol) || s));
  addSection('Defensive', DEFAULTS.defensive.map(s => stockResults.find(r => r.symbol === s.symbol) || s));
  addSection('Crypto', DEFAULTS.crypto, true);
  if (custom.length) {
    const customStocks = custom.filter(c => !c.crypto).map(c => stockResults.find(r => r.symbol === c.symbol) || c);
    const customCrypto = custom.filter(c => c.crypto);
    if (customStocks.length) addSection('Your Stocks', customStocks);
    if (customCrypto.length) addSection('Your Crypto', customCrypto, true);
  }

  sectionsEl.innerHTML = html;

  // Top movers
  allItems.sort((a, b) => b.pct - a.pct);
  const gainers = allItems.slice(0, 5);
  const losers = [...allItems].sort((a, b) => a.pct - b.pct).slice(0, 5);
  moversEl.innerHTML = 
    '<strong>Top Gainers:</strong> ' + gainers.map(g => `<span class="mover up">${g.symbol} ${g.pct>=0?'+':''}${g.pct.toFixed(1)}%</span>`).join('') +
    ' &nbsp;|&nbsp; <strong>Biggest Drops:</strong> ' + losers.map(l => `<span class="mover down">${l.symbol} ${l.pct.toFixed(1)}%</span>`).join('');

  // News
  if (newsItems && newsItems.length) {
    newsList.innerHTML = newsItems.map(n => `
      <div class="news-item">
        <a href="${n.url || n.link}" target="_blank" rel="noopener">${n.title || n.headline}</a>
        <div class="news-meta">${n.source || n.publisher || ''} · ${n.publishedAt || n.pubDate || ''}</div>
      </div>
    `).join('');
  } else {
    newsList.innerHTML = '<div class="news-item"><a href="https://finance.yahoo.com/news/" target="_blank">Yahoo Finance News</a></div><div class="news-item"><a href="https://www.cnbc.com/markets/" target="_blank">CNBC Markets</a></div>';
  }

  updatePortfolioSummary();
  status.textContent = 'Updated ' + new Date().toLocaleTimeString();
}

// TradingView script
const tvScript = document.createElement('script');
tvScript.src = 'https://s3.tradingview.com/tv.js';
tvScript.onload = () => showChart('^GSPC');
document.head.appendChild(tvScript);

loadData();
setInterval(loadData, 60000);
setInterval(updateMarketStatus, 60000);
</script>
</body>
</html>
